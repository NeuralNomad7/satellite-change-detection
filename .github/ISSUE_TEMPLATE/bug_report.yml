name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The most useful thing you can
        include is the exact command you ran and the full traceback.

        For security vulnerabilities, please do not use this form — report
        privately through GitHub security advisories instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command(s) or code you ran.
      render: shell
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Full traceback or error output
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: Which part of the pipeline?
      options:
        - Training (sat-cd-train)
        - Evaluation (sat-cd-eval)
        - Geospatial inference (sat-cd-geo)
        - Sentinel-2 ingestion (sat-cd-ingest)
        - ONNX export (sat-cd-export)
        - Serving API / Docker
        - Streamlit demo
        - Installation / packaging
        - Other or not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: "Output of: python -c \"import importlib.metadata as m; print(m.version('satellite-change-detection'))\""
      placeholder: "1.3.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and the versions of torch and rasterio.
      placeholder: "Ubuntu 24.04, Python 3.12, torch 2.13.0, rasterio 1.5.1"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this has not already been reported.
          required: true
