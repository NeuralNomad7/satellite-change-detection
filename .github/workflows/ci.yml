name: CI

on:
  push:
    branches: [main, develop]
  # No branch filter: `pull_request` filters on the BASE branch, so limiting it
  # to `main` silently skips CI for stacked PRs that target a feature branch.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and dev tooling
        run: |
          python -m pip install --upgrade pip
          # mypy needs the real dependency stubs to check anything meaningful;
          # without the project installed it silently skips every third-party
          # type. The CPU wheel keeps the download small since runners have no GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src/ tests/ scripts/

      - name: Check formatting with Ruff
        run: ruff format --check src/ tests/ scripts/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  model-smoke-test:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify model forward pass
        run: |
          python -c "
          import torch
          from src.models import build_model

          model = build_model(in_channels=3, pretrained=False)
          model.eval()

          x1 = torch.randn(1, 3, 256, 256)
          x2 = torch.randn(1, 3, 256, 256)

          with torch.no_grad():
              out = model(x1, x2)

          assert out['pred'].shape == (1, 1, 256, 256), f'Unexpected shape: {out[\"pred\"].shape}'
          print('Model smoke test passed: output shape (1, 1, 256, 256)')
          "

      - name: Verify ONNX export
        run: |
          python -c "
          import torch
          from src.models import build_model

          model = build_model(in_channels=3, pretrained=False, deep_supervision=False)
          model.eval()

          x1 = torch.randn(1, 3, 256, 256)
          x2 = torch.randn(1, 3, 256, 256)

          torch.onnx.export(
              model, (x1, x2), '/tmp/test_model.onnx',
              input_names=['image_t1', 'image_t2'],
              output_names=['change_mask'],
              opset_version=17,
              dynamo=False,
          )
          print('ONNX export smoke test passed')
          "
