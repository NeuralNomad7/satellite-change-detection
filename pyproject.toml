[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-change-detection"
version = "1.4.0"
description = "Deep learning pipeline for satellite imagery change detection using Sentinel-2 data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NeuralNomad7" }]
keywords = [
    "deep-learning",
    "change-detection",
    "remote-sensing",
    "sentinel-2",
    "pytorch",
    "semantic-segmentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/neuralnomad7/satellite-change-detection"
Repository = "https://github.com/neuralnomad7/satellite-change-detection"
Issues = "https://github.com/neuralnomad7/satellite-change-detection/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Keep these floors in step with the hook revisions in .pre-commit-config.yaml
    # so a stale local install can't format or type-check differently from CI.
    "ruff>=0.16",
    "mypy>=2.3",
    "pre-commit>=3.7",
]
# Sentinel-2 STAC ingestion (sat-cd-ingest). Optional: only needed to fetch
# real imagery from the Microsoft Planetary Computer.
ingest = [
    # 0.8.3 is the first release that applies the `timeout` passed to Client.open.
    "pystac-client>=0.8.3",
    "planetary-computer>=1.0",
]

[project.scripts]
sat-cd-train = "src.train:main"
sat-cd-eval = "src.eval:main"
sat-cd-export = "scripts.export_onnx:main"
sat-cd-geo = "scripts.predict_geo:main"
sat-cd-ingest = "scripts.ingest_s2:main"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]

[tool.mypy]
# Intentionally not pinning python_version: modern dependency stubs (numpy 2.5+)
# use PEP 695 syntax that mypy cannot parse when asked to target 3.11. Ruff's
# target-version = "py311" and the 3.11 entry in the CI test matrix are what
# guard minimum-version compatibility; tests/test_package.py keeps those in
# sync with requires-python and the classifiers.
files = ["src"]
ignore_missing_imports = true
strict_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
