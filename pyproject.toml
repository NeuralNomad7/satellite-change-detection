[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-change-detection"
version = "1.2.0"
description = "Deep learning pipeline for satellite imagery change detection using Sentinel-2 data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NeuralNomad7" }]
keywords = [
    "deep-learning",
    "change-detection",
    "remote-sensing",
    "sentinel-2",
    "pytorch",
    "semantic-segmentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/neuralnomad7/satellite-change-detection"
Repository = "https://github.com/neuralnomad7/satellite-change-detection"
Issues = "https://github.com/neuralnomad7/satellite-change-detection/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
sat-cd-train = "src.train:main"
sat-cd-eval = "src.eval:main"
sat-cd-export = "scripts.export_onnx:main"
sat-cd-geo = "scripts.predict_geo:main"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
strict_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
